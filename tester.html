<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mockup Tribute Pop-up V4</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --obsidian: #0A1128; --gold-lux: #C5A059; --text-main: #0F172A; 
            --text-muted: #94A3B8; --success-glow: #059669; --danger-glow: #E11D48;
        }

        body {
            margin: 0; padding: 0; font-family: 'Montserrat', sans-serif;
            background-color: var(--obsidian); display: flex; align-items: center; 
            justify-content: center; height: 100vh; overflow: hidden;
        }

        /* Tombol Simulasi Awal */
        .btn-simulasi {
            background: #1E293B; color: var(--gold-lux); border: 1px solid var(--gold-lux);
            padding: 15px 30px; border-radius: 15px; font-family: 'Montserrat';
            font-size: 14px; font-weight: 900; cursor: pointer; transition: 0.2s;
            margin: 10px; display: block;
        }
        .btn-simulasi:active { transform: scale(0.95); }

        /* =======================================================
           TRIBUTE OVERLAY (MODE CHARGING)
           ======================================================= */
        .tribute-overlay {
            position: fixed; inset: 0; background: rgba(5, 8, 20, 0.95);
            backdrop-filter: blur(15px); z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease-in-out;
            padding: 20px; box-sizing: border-box;
        }
        .tribute-overlay.show { opacity: 1; pointer-events: auto; }

        .tribute-content-wrapper {
            width: 100%; max-width: 360px;
            display: flex; flex-direction: column; align-items: center;
            transform: translateY(20px) scale(0.95); 
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .tribute-overlay.show .tribute-content-wrapper { transform: translateY(0) scale(1); }

        /* JUDUL DI ATAS FOTO */
        .t-title {
            font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 900;
            color: var(--gold-lux); letter-spacing: 1px; margin-bottom: 15px;
            text-transform: uppercase; text-align: center;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* FRAME FOTO (SAMA PERSIS KAYA SPLASH SCREEN) */
        .splash-landscape-frame { 
            width: 100%; aspect-ratio: 16/10; border-radius: 16px; overflow: hidden; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.6); 
            border: 1px solid rgba(255,255,255,0.15); 
            position: relative; margin-bottom: 20px; background: #000;
        }
        
        .t-slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; object-position: center; 
            opacity: 0; transition: opacity 1.5s ease-in-out;
        }
        .t-slide.active { opacity: 1; }

        /* QUOTE DI BAWAH FOTO */
        .t-quote {
            font-size: 13px; font-weight: 500; color: #E2E8F0; 
            line-height: 1.6; text-align: center; margin-bottom: 35px;
            padding: 0 10px; font-style: italic;
        }

        /* =======================================================
           HUD CHARGING (INFO SLOT & TOMBOL)
           ======================================================= */
        .charging-hud {
            width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px;
            padding-top: 25px; border-top: 1px dashed rgba(255,255,255,0.1);
        }

        .hud-slot-info {
            color: var(--success-glow); font-size: 12px; font-weight: 800;
            letter-spacing: 1px; text-transform: uppercase;
            display: flex; align-items: center; gap: 8px;
            animation: pulseText 2s infinite;
        }
        .hud-slot-info span { color: white; font-weight: 900; font-size: 14px; }
        
        @keyframes pulseText {
            0%, 100% { opacity: 0.6; } 50% { opacity: 1; }
        }

        /* Tombol Merah Elite */
        .btn-stop-charging {
            width: 100%; background: var(--danger-glow); color: white; border: none;
            padding: 16px 0; border-radius: 16px;
            font-family: 'Montserrat'; font-size: 13px; font-weight: 900; letter-spacing: 1px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 10px 25px rgba(225, 29, 72, 0.3); transition: 0.2s;
        }
        .btn-stop-charging:active { transform: scale(0.97); box-shadow: 0 5px 15px rgba(225, 29, 72, 0.4); }

        /* Tombol Secondary Pantau Antrean */
        .btn-pantau {
            background: transparent; color: var(--text-muted); border: none;
            padding: 10px; font-family: 'Montserrat'; font-size: 11px; font-weight: 700;
            cursor: pointer; transition: 0.2s; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-pantau:active { color: white; transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- TOMBOL SIMULASI MASUK SLOT DARI DASHBOARD -->
    <div>
        <button class="btn-simulasi" onclick="bukaTribute(1)">MASUK SLOT 1</button>
        <button class="btn-simulasi" onclick="bukaTribute(2)">MASUK SLOT 2</button>
    </div>

    <!-- TRIBUTE OVERLAY -->
    <div class="tribute-overlay" id="modalTribute">
        <div class="tribute-content-wrapper">
            
            <!-- 1. JUDUL DI ATAS FOTO -->
            <div class="t-title" id="tributeTitle">[ H-X ] SEBELUM SAYA BENAR-BENAR PADAM.</div>
            
            <!-- 2. FRAME FOTO (Style Splash Screen) -->
            <div class="splash-landscape-frame">
                <img id="tFoto1" class="t-slide active" src="foto1.jpg" alt="" onerror="this.src='https://images.unsplash.com/photo-1558981420-87aa9dad1c89?q=80&w=600&auto=format&fit=crop'">
                <img id="tFoto2" class="t-slide" src="foto2.jpg" alt="" onerror="this.src='https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?q=80&w=600&auto=format&fit=crop'">
            </div>
            
            <!-- 3. QUOTE DI BAWAH FOTO -->
            <div class="t-quote">
                "Biarkan saya mengisi daya kalian sekali lagi. Bukan hanya untuk motor kalian, tapi untuk semua kenangan hebat yang pernah kita ciptakan bersama di sudut Kelapa Gading ini. Terima kasih telah singgah."
            </div>

            <!-- 4. HUD CHARGING (INFO SLOT & TOMBOL) -->
            <div class="charging-hud">
                <div class="hud-slot-info">
                    <i class="fas fa-bolt"></i> PENGISIAN BERJALAN DI <span id="slotNumberDisplay">SLOT X</span>
                </div>
                
                <button class="btn-stop-charging" onclick="simulasikanStop()">
                    <i class="fas fa-power-off"></i> SELESAI CHARGING
                </button>
                
                <button class="btn-pantau" onclick="tutupTribute()">
                    <i class="fas fa-eye"></i> PANTAU ANTREAN LAIN
                </button>
            </div>

        </div>
    </div>

    <script>
        const modalTribute = document.getElementById('modalTribute');
        const tributeTitle = document.getElementById('tributeTitle');
        const slotNumberDisplay = document.getElementById('slotNumberDisplay');
        let slideInterval;

        // Auto Hitung H- Mundur
        function hitungMundur() {
            const sekarang = new Date().getTime();
            const tahunIni = new Date().getFullYear();
            const target = new Date(`${tahunIni}-07-31T23:59:59`).getTime();
            
            const selisih = target - sekarang;
            const hari = Math.ceil(selisih / (1000 * 60 * 60 * 24));
            
            if (hari > 0) {
                tributeTitle.innerText = `[ H-${hari} ] SEBELUM SAYA BENAR-BENAR PADAM.`;
            } else if (hari === 0) {
                tributeTitle.innerText = `[ HARI TERAKHIR ] SEBELUM SAYA PADAM.`;
            } else {
                tributeTitle.innerText = `[ MEMORI ] SEBELUM SAYA PADAM.`;
            }
        }
        hitungMundur();

        // BUKA POP-UP SEKALIGUS UPDATE INFO SLOT
        function bukaTribute(nomorSlot) {
            slotNumberDisplay.innerText = `SLOT ${nomorSlot}`;
            modalTribute.classList.add('show');
            mulaiSlideshow();
        }

        function tutupTribute() {
            modalTribute.classList.remove('show');
            clearInterval(slideInterval);
        }

        function simulasikanStop() {
            alert(`Simulasi: Anda menghentikan charging di ${slotNumberDisplay.innerText}. Mengosongkan slot...`);
            tutupTribute();
        }

        // Logic Slideshow Foto 1-14
        const totalPhotos = 14;
        let currentIdx = 1;
        const img1 = document.getElementById('tFoto1');
        const img2 = document.getElementById('tFoto2');
        let isImg1Active = true;

        function mulaiSlideshow() {
            if(slideInterval) clearInterval(slideInterval);
            
            slideInterval = setInterval(() => {
                currentIdx++;
                if (currentIdx > totalPhotos) currentIdx = 1;

                if (isImg1Active) {
                    img2.src = `foto${currentIdx}.jpg`;
                    img2.onerror = function() { this.src = 'https://images.unsplash.com/photo-1558981806-ec527fa84c39?q=80&w=600&auto=format&fit=crop'; };
                    img2.classList.add('active');
                    img1.classList.remove('active');
                } else {
                    img1.src = `foto${currentIdx}.jpg`;
                    img1.onerror = function() { this.src = 'https://images.unsplash.com/photo-1449426468159-d96dbf08f19f?q=80&w=600&auto=format&fit=crop'; };
                    img1.classList.add('active');
                    img2.classList.remove('active');
                }
                isImg1Active = !isImg1Active;
            }, 4000); 
        }
    </script>
</body>
</html>
