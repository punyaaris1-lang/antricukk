<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mockup Tribute Pop-up</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --obsidian: #0A1128; --gold-lux: #C5A059; --text-main: #0F172A; 
            --success-glow: #059669;
        }

        body {
            margin: 0; padding: 0; font-family: 'Montserrat', sans-serif;
            background-color: #F4F7FC; display: flex; align-items: center; 
            justify-content: center; height: 100vh; overflow: hidden;
        }

        /* Tombol Simulasi (Anggap aja ini tombol MASUK SLOT) */
        .btn-simulasi {
            background: var(--obsidian); color: var(--gold-lux); border: none;
            padding: 15px 30px; border-radius: 15px; font-family: 'Montserrat';
            font-size: 14px; font-weight: 900; letter-spacing: 1px;
            cursor: pointer; box-shadow: 0 10px 25px rgba(10,17,40,0.3);
            transition: 0.2s;
        }
        .btn-simulasi:active { transform: scale(0.95); }

        /* =======================================================
           TRIBUTE POP-UP OVERLAY (TEMA KESEDIHAN / CINEMATIC)
           ======================================================= */
        .tribute-overlay {
            position: fixed; inset: 0; background: rgba(5, 8, 20, 0.95);
            backdrop-filter: blur(15px); z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 1.2s ease-in-out;
            padding: 20px;
        }
        .tribute-overlay.show {
            opacity: 1; pointer-events: auto;
        }

        /* BINGKAI FOTO */
        .tribute-frame {
            position: relative; width: 100%; max-width: 340px; aspect-ratio: 4/5;
            background: #000; border-radius: 12px; overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(197, 160, 89, 0.3); /* List Emas Redup */
            transform: translateY(20px); transition: transform 1.2s ease-out;
        }
        .tribute-overlay.show .tribute-frame {
            transform: translateY(0);
        }

        /* FOTO SLIDESHOW (DOUBLE LAYER) */
        .t-slide {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; object-position: center; filter: grayscale(20%) contrast(110%);
            opacity: 0; transform: scale(1.05);
            transition: opacity 2s ease-in-out, transform 6s linear;
        }
        .t-slide.active {
            opacity: 0.8; /* Sengaja diredupin dikit biar nuansanya melankolis */
            transform: scale(1);
        }

        /* GRADASI BAWAH FOTO UNTUK TEKS */
        .tribute-gradient {
            position: absolute; inset: 0;
            background: linear-gradient(0deg, rgba(5,8,20,1) 0%, rgba(5,8,20,0.4) 40%, transparent 100%);
            z-index: 2;
        }

        /* TEKS EMOSIONAL (DI DALAM BINGKAI) */
        .tribute-content {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 30px 20px 20px; z-index: 3; text-align: center;
        }
        .t-title {
            font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 900;
            color: var(--gold-lux); letter-spacing: 2px; margin-bottom: 8px;
            text-transform: uppercase;
        }
        .t-desc {
            font-size: 11px; font-weight: 500; color: #CBD5E1; line-height: 1.6;
            letter-spacing: 0.5px; margin-bottom: 25px;
        }

        /* TOMBOL TUTUP POP-UP */
        .btn-tribute-close {
            background: transparent; border: 1px solid rgba(197, 160, 89, 0.5);
            color: var(--gold-lux); padding: 12px 20px; border-radius: 20px;
            font-family: 'Montserrat'; font-size: 10px; font-weight: 800;
            letter-spacing: 1px; cursor: pointer; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-tribute-close:active { background: rgba(197, 160, 89, 0.1); transform: scale(0.95); }

        /* TEKS STATUS CHARGING JALAN TERUS (Di luar bingkai) */
        .charging-status-text {
            color: var(--success-glow); font-size: 12px; font-weight: 800;
            margin-top: 25px; letter-spacing: 2px; text-transform: uppercase;
            display: flex; align-items: center; gap: 8px;
            animation: pulseText 2s infinite;
        }
        @keyframes pulseText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- TOMBOL SIMULASI MASUK SLOT -->
    <button class="btn-simulasi" onclick="bukaTribute()">
        <i class="fas fa-bolt"></i> MASUK SLOT CHARGING
    </button>

    <!-- POP-UP TRIBUTE -->
    <div class="tribute-overlay" id="modalTribute">
        
        <div class="tribute-frame">
            <!-- 2 Layer Foto untuk Transisi Halus -->
            <img id="tFoto1" class="t-slide active" src="foto1.jpg" alt="" onerror="this.src='https://images.unsplash.com/photo-1558981420-87aa9dad1c89?q=80&w=600&auto=format&fit=crop'">
            <img id="tFoto2" class="t-slide" src="foto2.jpg" alt="" onerror="this.src='https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?q=80&w=600&auto=format&fit=crop'">
            
            <div class="tribute-gradient"></div>
            
            <div class="tribute-content">
                <div class="t-title">TERIMA KASIH, GADING.</div>
                <div class="t-desc">Sambil daya bateraimu terisi, mari kenang sejenak momen kebersamaan kita di sini, sebelum hari itu tiba.</div>
                
                <button class="btn-tribute-close" onclick="tutupTribute()">
                    <i class="fas fa-eye"></i> PANTAU ANTREAN
                </button>
            </div>
        </div>

        <!-- Indikator meyakinkan bahwa charging tetap jalan -->
        <div class="charging-status-text">
            <i class="fas fa-bolt"></i> PENGISIAN SEDANG BERJALAN...
        </div>

    </div>

    <script>
        const modalTribute = document.getElementById('modalTribute');
        let slideInterval;

        function bukaTribute() {
            modalTribute.classList.add('show');
            mulaiSlideshow();
        }

        function tutupTribute() {
            modalTribute.classList.remove('show');
            clearInterval(slideInterval); // Matikan slideshow kalau ditutup biar hemat memori
        }

        // Logic Slideshow Khusus Pop-up
        const totalPhotos = 14;
        let currentIdx = 1;
        const img1 = document.getElementById('tFoto1');
        const img2 = document.getElementById('tFoto2');
        let isImg1Active = true;

        function mulaiSlideshow() {
            // Bersihin interval sebelumnya kalau ada
            if(slideInterval) clearInterval(slideInterval);
            
            slideInterval = setInterval(() => {
                currentIdx++;
                if (currentIdx > totalPhotos) currentIdx = 1;

                if (isImg1Active) {
                    img2.src = `foto${currentIdx}.jpg`;
                    img2.onerror = function() { this.src = 'https://images.unsplash.com/photo-1558981806-ec527fa84c39?q=80&w=600&auto=format&fit=crop'; };
                    img2.classList.add('active');
                    img1.classList.remove('active');
                } else {
                    img1.src = `foto${currentIdx}.jpg`;
                    img1.onerror = function() { this.src = 'https://images.unsplash.com/photo-1449426468159-d96dbf08f19f?q=80&w=600&auto=format&fit=crop'; };
                    img1.classList.add('active');
                    img2.classList.remove('active');
                }
                isImg1Active = !isImg1Active;
            }, 5000); // Ganti tiap 5 detik (lebih lama biar nuansa sedihnya kerasa)
        }
    </script>
</body>
</html>
